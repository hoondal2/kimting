services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kimting-pgvector
    environment:
      POSTGRES_DB: kimting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector_data:
